<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesso à demonstração do dashboard LockMachine.">
  <title>Login | LockMachine</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-back" href="sobre.html">← Voltar ao projeto</a>
    <section class="login-intro">
      <div class="lock-brand large"><span class="lock-icon"></span><strong>Lock<span>Machine</span></strong></div>
      <p>Sistema de controle de acesso para máquinas industriais.</p>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <p class="section-code">ÁREA RESTRITA</p>
        <h1>Acesse a demonstração.</h1>
        <p class="login-description">Esta tela representa o acesso do administrador ou supervisor ao painel do sistema.</p>

        <form data-demo-login>
          <label for="email">E-mail corporativo</label>
          <input id="email" name="email" type="email" placeholder="supervisor@empresa.com" required autocomplete="email">

          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required autocomplete="current-password">

          <p class="form-message" role="alert" data-form-message></p>
          <button class="login-submit" type="submit">Entrar no sistema <span>→</span></button>
        </form>

        <div class="demo-note"><span>i</span><p><strong>Modo demonstração</strong>Preencha os dois campos com qualquer informação válida.</p></div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
