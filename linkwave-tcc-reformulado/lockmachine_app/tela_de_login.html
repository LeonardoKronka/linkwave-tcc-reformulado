<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesso à demonstração do painel do supervisor do LockMachine.">
  <meta name="theme-color" content="#131614">
  <title>Acesso restrito | LockMachine</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="preload" href="../assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
  <script src="../assets/js/head.js"></script>
</head>
<body class="lockmachine login-page">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="sobre.html"><span class="brand-mark brand-mark--lock" aria-hidden="true"></span>LockMachine</a>
      <nav class="nav" aria-label="Navegação">
        <a href="sobre.html"><span class="icon icon--back" aria-hidden="true"></span>O projeto</a>
      </nav>
    </div>
  </header>

  <main class="login-main" id="conteudo">
    <section class="login-sign" data-login-sign data-intro>
      <div class="login-head">
        <h1 class="sign-word">Acesso restrito</h1>
        <p role="status">Painel de supervisores e administradores.</p>
      </div>

      <!-- A validação é feita no script.js, que mostra o erro na própria placa. -->
      <form class="login-body" novalidate data-demo-login>
        <div class="field">
          <label class="label" for="email">E-mail corporativo</label>
          <input id="email" name="email" type="email" placeholder="supervisor@empresa.com" required autocomplete="email">
        </div>
        <div class="field">
          <label class="label" for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <p class="form-error" role="alert" data-form-message></p>
        <button class="button login-submit" type="submit">Entrar no painel<span class="icon icon--arrow" aria-hidden="true"></span></button>

        <p class="notice"><span class="icon icon--warn" aria-hidden="true"></span><span>Modo demonstração: preencha com qualquer e-mail válido e qualquer senha. Não há autenticação nesta fase.</span></p>
      </form>
    </section>
  </main>

  <script src="../assets/vendor/gsap/gsap.min.js"></script>
  <script src="../assets/vendor/gsap/SplitText.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
